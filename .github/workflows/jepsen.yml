name: Jepsen

# Comment-triggered Jepsen run. A maintainer comments `/jepsen` on a PR
# to launch the suite against that PR's HEAD. Syntax:
#
#   /jepsen                              — all default workloads
#   /jepsen safe-counter                 — single workload
#   /jepsen safe-counter time=120        — override --time-limit (seconds)
#   /jepsen safe-counter ref=my-branch   — override the swytch.jepsen ref
#   /jepsen time=120 ref=my-branch       — knobs on the full matrix
#
# Workloads run as a fan-out matrix against an isolated namespace each
# in the configured Kubernetes cluster. Only one Jepsen run can be in
# flight at a time (workflow-level concurrency lock).
#
# Required repository secrets:
#   KUBECONFIG_B64 — base64-encoded kubeconfig with create/delete/exec
#                    permission on jepsen-* namespaces.

on:
  issue_comment:
    types: [created]

# Workflow-level token is read-only. Jobs that need to comment/react
# upscope per-job; jobs that handle untrusted PR code (build, run)
# inherit the read-only minimum so a compromised build can't write
# back to the repo, PRs, or issues.
permissions:
  contents: read

concurrency:
  group: jepsen
  cancel-in-progress: false

jobs:
  prepare:
    name: Parse & gate
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/jepsen'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      workloads:    ${{ steps.parse.outputs.workloads }}
      time_limit:   ${{ steps.parse.outputs.time_limit }}
      jepsen_ref:   ${{ steps.parse.outputs.jepsen_ref }}
      image_tag:    ${{ steps.parse.outputs.image_tag }}
      pr_sha:       ${{ steps.pr.outputs.head_sha }}
      pr_number:    ${{ github.event.issue.number }}
      run_id:       ${{ github.run_id }}-${{ github.run_attempt }}
      tracking_comment_id: ${{ steps.track.outputs.comment_id }}
    steps:
      - name: Check maintainer association
        if: github.event_name == 'issue_comment'
        env:
          ASSOC: ${{ github.event.comment.author_association }}
        run: |
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR) echo "association: $ASSOC, allowed" ;;
            *) echo "::error::Author association '$ASSOC' is not permitted to trigger /jepsen"; exit 1 ;;
          esac

      - name: React to comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Parse comment
        id: parse
        env:
          EVENT: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Defaults
          DEFAULT_WORKLOADS='["safe-counter","safe-set","safe-sorted-set","none-counter","none-set","none-sorted-set","none-elle-causal","attrition-counter"]'
          TIME_LIMIT=60
          JEPSEN_REF=main
          SINGLE_WORKLOAD=""

          # Push events have no comment body; defaults apply unchanged.
          if [ "$EVENT" = "issue_comment" ]; then
            line="$(printf '%s' "$COMMENT_BODY" | head -n1)"
            rest="${line#/jepsen}"
          else
            rest=""
          fi
          # Tokenize on whitespace (no quoting support — we don't need it)
          read -r -a tokens <<<"$rest"

          valid_workloads='safe-counter safe-set safe-sorted-set none-counter none-set none-sorted-set none-elle-causal attrition-counter'

          for tok in "${tokens[@]}"; do
            case "$tok" in
              time=*)
                v="${tok#time=}"
                if ! [[ "$v" =~ ^[0-9]+$ ]] || [ "$v" -lt 10 ] || [ "$v" -gt 3600 ]; then
                  echo "::error::invalid time=$v (10..3600)"; exit 1
                fi
                TIME_LIMIT="$v"
                ;;
              ref=*)
                v="${tok#ref=}"
                if ! [[ "$v" =~ ^[A-Za-z0-9._/-]+$ ]]; then
                  echo "::error::invalid ref=$v"; exit 1
                fi
                JEPSEN_REF="$v"
                ;;
              "")
                ;;
              *)
                # Must be a workload name
                ok=0
                for w in $valid_workloads; do
                  if [ "$tok" = "$w" ]; then ok=1; break; fi
                done
                if [ "$ok" -ne 1 ]; then
                  echo "::error::unknown token '$tok' (expected a workload or time=/ref=)"; exit 1
                fi
                if [ -n "$SINGLE_WORKLOAD" ]; then
                  echo "::error::only one workload can be specified per comment"; exit 1
                fi
                SINGLE_WORKLOAD="$tok"
                ;;
            esac
          done

          if [ -n "$SINGLE_WORKLOAD" ]; then
            WORKLOADS_JSON="[\"$SINGLE_WORKLOAD\"]"
          else
            WORKLOADS_JSON="$DEFAULT_WORKLOADS"
          fi

          # Image tag: matches docker/metadata-action's branch-tag
          # sanitization (slashes -> dashes), and `main` -> `latest`.
          if [ "$JEPSEN_REF" = "main" ]; then
            IMAGE_TAG=latest
          else
            IMAGE_TAG="${JEPSEN_REF//\//-}"
          fi

          echo "workloads=$WORKLOADS_JSON" >>"$GITHUB_OUTPUT"
          echo "time_limit=$TIME_LIMIT"   >>"$GITHUB_OUTPUT"
          echo "jepsen_ref=$JEPSEN_REF"   >>"$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG"     >>"$GITHUB_OUTPUT"

      - name: Resolve PR head SHA
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'push') {
              core.setOutput('head_sha', context.sha);
              return;
            }
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            core.setOutput('head_sha', pr.data.head.sha);

      - name: Post tracking comment
        id: track
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        env:
          WORKLOADS:  ${{ steps.parse.outputs.workloads }}
          TIME_LIMIT: ${{ steps.parse.outputs.time_limit }}
          JEPSEN_REF: ${{ steps.parse.outputs.jepsen_ref }}
          PR_SHA:     ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const workloads = JSON.parse(process.env.WORKLOADS);
            const body = [
              `### Jepsen run started`,
              ``,
              `- PR HEAD: \`${process.env.PR_SHA}\``,
              `- swytch.jepsen ref: \`${process.env.JEPSEN_REF}\``,
              `- time limit: \`${process.env.TIME_LIMIT}s\` per workload`,
              `- [workflow run](${runUrl})`,
              ``,
              `| workload | result |`,
              `|---|---|`,
              ...workloads.map(w => `| \`${w}\` | ⏳ pending |`),
            ].join('\n');
            const res = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
            core.setOutput('comment_id', res.data.id);

  build:
    name: Build swytch binary
    needs: prepare
    runs-on: ubuntu-latest
    # This job checks out and builds untrusted PR code. Permissions are
    # read-only and no secrets are exposed — `go build` cannot execute
    # the target's code and CGO is disabled.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.pr_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build swytch (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build --tags nolicense -o swytch .
          ls -lh swytch
          file swytch

      - uses: actions/upload-artifact@v7
        with:
          name: swytch-binary
          path: swytch
          retention-days: 7

  run:
    name: ${{ matrix.workload }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: jepsen
    # Read-only on the repo; the kubeconfig (jepsen environment secret)
    # is scoped to the `jepsen` namespace only. The untrusted swytch
    # binary built from PR code is `kubectl cp`'d into the controller
    # pod and never executed on the runner.
    permissions:
      contents: read
    # Parser caps --time-limit at 3600s (60 min). The remaining ~30 min
    # is buffer for image pull, jepsen-side apt-update, kubectl cp, and
    # store/ retrieval.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # One workload at a time. The cluster has ~5 CPU truly free
      # against pods that want to burst, so serialising avoids us
      # fighting ourselves for CPU at runtime.
      max-parallel: 1
      matrix:
        workload: ${{ fromJSON(needs.prepare.outputs.workloads) }}
    env:
      NAMESPACE: jepsen
      RESOURCE_PREFIX: ${{ matrix.workload }}
      RUN_ID: ${{ needs.prepare.outputs.run_id }}
      WORKLOAD: ${{ matrix.workload }}
      JEPSEN_IMAGE: ghcr.io/swytchdb/swytch-jepsen:${{ needs.prepare.outputs.image_tag }}
      JEPSEN_REF: ${{ needs.prepare.outputs.jepsen_ref == 'main' && '' || needs.prepare.outputs.jepsen_ref }}
      JEPSEN_TIME_LIMIT: ${{ needs.prepare.outputs.time_limit }}
      JEPSEN_JOIN_DNS: jepsen.swytch.local
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.pr_sha }}
          sparse-checkout: |
            .github/jepsen-k8s
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: swytch-binary
          path: ./bin

      - name: Add cluster API host entry
        env:
          # The kubeconfig points the API server at internal.bottled.codes,
          # which has no public DNS record. Pin it to the cluster IP so
          # kubectl on the runner can reach the control plane.
          CLUSTER_HOST: internal.bottled.codes
          CLUSTER_IP: 65.108.75.198
        run: |
          echo "$CLUSTER_IP $CLUSTER_HOST" | sudo tee -a /etc/hosts
          getent hosts "$CLUSTER_HOST"

      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >>"$GITHUB_ENV"
          kubectl version --client=true
          kubectl config current-context

      - name: Determine workload params
        id: wp
        run: |
          case "$WORKLOAD" in
            safe-counter)     N=safe; W=counter ;;
            safe-set)         N=safe; W=set ;;
            safe-sorted-set)  N=safe; W=sorted-set ;;
            none-counter)     N=none; W=counter ;;
            none-set)         N=none; W=set ;;
            none-sorted-set)  N=none; W=sorted-set ;;
            none-elle-causal) N=none; W=elle-causal ;;
            attrition-counter) N=attrition; W=counter ;;
            *) echo "::error::unknown workload $WORKLOAD"; exit 1 ;;
          esac
          echo "nemesis=$N"  >>"$GITHUB_OUTPUT"
          echo "workload=$W" >>"$GITHUB_OUTPUT"

      - name: Generate ephemeral SSH keypair
        run: |
          mkdir -p secrets
          ssh-keygen -t ed25519 -N '' -f secrets/id_ed25519 -C "jepsen-${RUN_ID}-${WORKLOAD}"
          echo "SSH_AUTHORIZED_KEYS_B64=$(base64 -w0 < secrets/id_ed25519.pub)" >>"$GITHUB_ENV"

      - name: Clean stale resources for this workload
        run: |
          # Belt-and-suspenders: prior runs ought to have torn down, but
          # if a previous attempt was killed mid-step the labelled pods
          # and secret may linger and block apply.
          kubectl -n "$NAMESPACE" delete pod,secret \
            -l swytch-jepsen/workload="$WORKLOAD" \
            --ignore-not-found --wait=true --timeout=60s

      - name: Render & apply secret
        env:
          # Explicit allowlist; envsubst would otherwise eat any $VAR in
          # the YAML, including the controller command's shell vars.
          ENVSUBST_VARS: '$NAMESPACE $RESOURCE_PREFIX $RUN_ID $WORKLOAD $SSH_AUTHORIZED_KEYS_B64'
        run: |
          envsubst "$ENVSUBST_VARS" < .github/jepsen-k8s/ssh-secret.yaml | kubectl apply -f -

      - name: Apply node pods
        env:
          ENVSUBST_VARS: '$NAMESPACE $RESOURCE_PREFIX $RUN_ID $WORKLOAD $JEPSEN_IMAGE $NODE_INDEX'
        run: |
          for i in 0 1 2 3 4; do
            NODE_INDEX=$i envsubst "$ENVSUBST_VARS" < .github/jepsen-k8s/node-pod.yaml \
              | kubectl apply -f -
          done

      - name: Wait for node pods Ready
        run: |
          for i in 0 1 2 3 4; do
            kubectl -n "$NAMESPACE" wait --for=condition=Ready \
              pod/"${RESOURCE_PREFIX}-node-$i" --timeout=300s
          done

      - name: Collect node pod IPs
        id: ips
        run: |
          IPS=""
          for i in 0 1 2 3 4; do
            pod="${RESOURCE_PREFIX}-node-$i"
            IP=$(kubectl -n "$NAMESPACE" get pod "$pod" -o jsonpath='{.status.podIP}')
            if [ -z "$IP" ]; then echo "::error::no podIP for $pod"; exit 1; fi
            if [ -z "$IPS" ]; then IPS="$IP"; else IPS="$IPS,$IP"; fi
          done
          echo "Node IPs: $IPS"
          echo "nodes=$IPS" >>"$GITHUB_OUTPUT"

      - name: Apply controller pod
        env:
          JEPSEN_NODES:    ${{ steps.ips.outputs.nodes }}
          JEPSEN_WORKLOAD: ${{ steps.wp.outputs.workload }}
          JEPSEN_NEMESIS:  ${{ steps.wp.outputs.nemesis }}
          ENVSUBST_VARS: '$NAMESPACE $RESOURCE_PREFIX $RUN_ID $WORKLOAD $JEPSEN_IMAGE $JEPSEN_REF $JEPSEN_NODES $JEPSEN_WORKLOAD $JEPSEN_NEMESIS $JEPSEN_TIME_LIMIT $JEPSEN_JOIN_DNS'
        run: |
          envsubst "$ENVSUBST_VARS" < .github/jepsen-k8s/controller-pod.yaml \
            | kubectl apply -f -
          kubectl -n "$NAMESPACE" wait --for=condition=Ready \
            pod/"${RESOURCE_PREFIX}-controller" --timeout=300s

      - name: Upload inputs to controller workspace
        run: |
          ctrl="${RESOURCE_PREFIX}-controller"
          # Use the holder sidecar for all cp operations: it shares the
          # workspace volume and is guaranteed to stay Running even
          # after the controller container exits.
          kubectl -n "$NAMESPACE" cp -c holder ./bin/swytch         "$ctrl:/workspace/swytch"
          kubectl -n "$NAMESPACE" cp -c holder ./secrets/id_ed25519 "$ctrl:/workspace/id_ed25519"
          kubectl -n "$NAMESPACE" exec "$ctrl" -c holder -- touch /workspace/.ready

      - name: Stream controller logs
        run: |
          # `kubectl logs -f` follows the controller container's stdout
          # and exits when that container terminates (the holder sidecar
          # keeps running, but we're not watching it).
          kubectl -n "$NAMESPACE" logs -f \
            "${RESOURCE_PREFIX}-controller" -c controller

      - name: Capture exit status
        id: status
        run: |
          ctrl="${RESOURCE_PREFIX}-controller"
          # Pod phase stays Running because the holder sidecar is alive;
          # we want the controller container's terminated exit code.
          ec=$(kubectl -n "$NAMESPACE" get pod "$ctrl" \
                -o jsonpath='{.status.containerStatuses[?(@.name=="controller")].state.terminated.exitCode}')
          echo "controller container exit=$ec"
          echo "exit_code=${ec:-1}" >>"$GITHUB_OUTPUT"

      - name: Copy store/ out
        if: always()
        run: |
          # Both `kubectl cp` and `kubectl exec | tar` have failed with
          # "unexpected EOF" on store trees of any real size — the
          # underlying SPDY stream truncates. Workaround: build a single
          # compressed tarball inside the pod first, then fetch that
          # one regular file via `kubectl cp`. A single-file cp is the
          # simplest case for kubectl's wrapper and supports --retries.
          #
          # If `kubectl cp` still truncates (92 MB+ tarballs over SPDY),
          # fall back to streaming via `kubectl exec … cat` which uses a
          # simpler code path.
          set +e
          pod="${RESOURCE_PREFIX}-controller"

          # --- build tarball inside the pod ---
          kubectl -n "$NAMESPACE" exec -c holder "$pod" -- \
            bash -c 'cd /workspace && tar -czf store.tar.gz store && ls -lh store.tar.gz'
          if [ $? -ne 0 ]; then
            echo "::warning::failed to build store.tar.gz in pod"
          else
            # --- fetch with kubectl cp (up to 3 retries) ---
            got=false
            kubectl -n "$NAMESPACE" cp -c holder --retries=3 \
              "$pod:/workspace/store.tar.gz" ./store.tar.gz \
              && gzip -t ./store.tar.gz 2>/dev/null \
              && got=true

            # --- fallback: stream via cat if cp produced a bad file ---
            if [ "$got" != "true" ]; then
              echo "::warning::kubectl cp failed or produced a truncated file, retrying via exec cat"
              rm -f ./store.tar.gz
              for attempt in 1 2 3; do
                kubectl -n "$NAMESPACE" exec -c holder "$pod" -- \
                  cat /workspace/store.tar.gz > ./store.tar.gz
                if gzip -t ./store.tar.gz 2>/dev/null; then
                  got=true
                  break
                fi
                echo "::warning::exec cat attempt $attempt failed integrity check"
                rm -f ./store.tar.gz
                sleep 2
              done
            fi

            if [ "$got" = "true" ] && [ -s ./store.tar.gz ]; then
              tar -xzf store.tar.gz || echo "::warning::tar extraction failed"
              rm -f store.tar.gz
            else
              echo "::warning::could not retrieve a valid store.tar.gz after all attempts"
            fi
          fi
          ls -la store 2>/dev/null || echo "store/ not retrieved"

      - name: Parse results.edn
        if: always()
        id: result
        run: |
          parse_valid() {
            # Look for `:valid? <value>` in the top-level results map.
            # Jepsen prints the top-level :valid? last and closes it with `}`
            # (sub-checker :valid? entries are followed by `,` because more keys
            # follow inside their map). Anchor on the closing brace and take the
            # last match to avoid picking up a passing nested checker.
            grep -oE ':valid\?[[:space:]]+(true|false|:unknown)\}' "$1" \
              | tail -n1 | grep -oE '(true|false|:unknown)'
          }

          # Find the latest run dir (jepsen writes a `latest` symlink, but
          # `kubectl cp` doesn't follow symlinks reliably; walk by mtime).
          latest=$(find store -maxdepth 3 -name results.edn -printf '%T@ %p\n' 2>/dev/null \
                   | sort -n | tail -n1 | awk '{print $2}')

          if [ -n "$latest" ]; then
            echo "results file: $latest"
            v=$(parse_valid "$latest")
          else
            echo "::notice::store/ not available, falling back to controller log output"
            # Jepsen prints results.edn to stdout; the "Stream controller
            # logs" step captured it. Scrape the verdict from the log file
            # that GitHub wrote for step 8 (index 0-based). This is fragile
            # but better than reporting "missing" when the test actually ran.
            logfile=$(find /home/runner/work/_temp -name '*.txt' -newer /dev/null 2>/dev/null \
                      | xargs grep -l 'Everything looks good\|:valid?' 2>/dev/null \
                      | head -n1)
            if [ -n "$logfile" ]; then
              echo "found log with results: $logfile"
              v=$(parse_valid "$logfile")
            fi
          fi

          case "${v:-}" in
            true)     echo "valid=true"     >>"$GITHUB_OUTPUT" ;;
            false)    echo "valid=false"    >>"$GITHUB_OUTPUT" ;;
            :unknown) echo "valid=unknown"  >>"$GITHUB_OUTPUT" ;;
            *)        echo "valid=missing"  >>"$GITHUB_OUTPUT" ;;
          esac

      - name: Write workload result manifest
        if: always()
        run: |
          mkdir -p result
          jq -n \
            --arg workload "$WORKLOAD" \
            --arg valid "${{ steps.result.outputs.valid }}" \
            --arg exit "${{ steps.status.outputs.exit_code }}" \
            '{workload: $workload, valid: $valid, exit: ($exit | tonumber? // 1)}' \
            > "result/${WORKLOAD}.json"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jepsen-store-${{ matrix.workload }}
          path: store
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jepsen-result-${{ matrix.workload }}
          path: result
          retention-days: 14

      - name: Teardown workload resources
        if: always()
        run: |
          kubectl -n "$NAMESPACE" delete pod,secret \
            -l swytch-jepsen/workload="$WORKLOAD" \
            --ignore-not-found --wait=false

      - name: Fail step if workload invalid
        if: always()
        run: |
          v="${{ steps.result.outputs.valid }}"
          case "$v" in
            true) echo "workload passed" ;;
            *)    echo "::error::workload $WORKLOAD result: $v"; exit 1 ;;
          esac

  summarize:
    name: Summarize
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, run]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: jepsen-result-*
          path: results
          merge-multiple: true

      - name: Update tracking comment
        if: needs.prepare.outputs.tracking_comment_id != ''
        uses: actions/github-script@v9
        env:
          COMMENT_ID:  ${{ needs.prepare.outputs.tracking_comment_id }}
          WORKLOADS:   ${{ needs.prepare.outputs.workloads }}
          TIME_LIMIT:  ${{ needs.prepare.outputs.time_limit }}
          JEPSEN_REF:  ${{ needs.prepare.outputs.jepsen_ref }}
          PR_SHA:      ${{ needs.prepare.outputs.pr_sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const workloads = JSON.parse(process.env.WORKLOADS);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // download-artifact preserves the `result/` parent dir each
            // workload uploaded with, so the JSONs land under
            // results/result/<workload>.json. Walk recursively to stay
            // robust against either layout.
            const results = {};
            try {
              const entries = fs.readdirSync('results', { recursive: true, withFileTypes: true });
              for (const e of entries) {
                if (!e.isFile() || !e.name.endsWith('.json')) continue;
                const full = path.join(e.parentPath || e.path, e.name);
                try {
                  const r = JSON.parse(fs.readFileSync(full, 'utf8'));
                  if (r && r.workload) results[r.workload] = r;
                } catch (err) {
                  core.warning(`bad result file ${full}: ${err.message}`);
                }
              }
            } catch (e) {
              core.warning(`could not read results: ${e.message}`);
            }

            const icon = (r) => {
              if (!r) return '⚠️ no result';
              if (r.valid === 'true')    return '✅ valid';
              if (r.valid === 'false')   return '❌ invalid';
              if (r.valid === 'unknown') return '❔ unknown';
              return '⚠️ missing';
            };

            const rows = workloads.map(w => {
              const r = results[w];
              const art = `[jepsen-store-${w}](${runUrl}#artifacts)`;
              return `| \`${w}\` | ${icon(r)} | ${art} |`;
            });

            const anyInvalid = workloads.some(w => (results[w]?.valid === 'false'));
            const anyMissing = workloads.some(w => !results[w] || results[w].valid === 'missing');
            const heading = anyInvalid
              ? '### Jepsen run: ❌ anomalies detected'
              : anyMissing
                ? '### Jepsen run: ⚠️ completed with missing results'
                : '### Jepsen run: ✅ all workloads valid';

            const body = [
              heading,
              ``,
              `- PR HEAD: \`${process.env.PR_SHA}\``,
              `- swytch.jepsen ref: \`${process.env.JEPSEN_REF}\``,
              `- time limit: \`${process.env.TIME_LIMIT}s\` per workload`,
              `- [workflow run](${runUrl})`,
              ``,
              `| workload | result | artifacts |`,
              `|---|---|---|`,
              ...rows,
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.COMMENT_ID),
              body,
            });
