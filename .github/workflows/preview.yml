name: Preview Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag suffix (e.g. "42" produces ghcr.io/swytchdb/swytch:pr-42)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/swytchdb/swytch:pr-${{ inputs.tag }}
          build-args: |
            VERSION=pr-${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
