apiVersion: swytch.getswytch.com/v1alpha1
kind: Swytch
metadata:
  name: app-cache
spec:
  deployment: sidecar
  memory: 512Mi
  sidecar:
    transport: tcp
  discovery:
    dns:
      secretKeyRef:
        name: swytch-secret
        key: cluster-passphrase
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: example-app
  template:
    metadata:
      labels:
        app: example-app
      annotations:
        swytch.getswytch.com/profile: app-cache
    spec:
      containers:
        - name: app
          image: redis:7.4-alpine
          command: [sh, -c, 'while true; do redis-cli -h 127.0.0.1 PING; sleep 10; done']
